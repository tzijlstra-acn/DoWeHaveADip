name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/dipdca

      - name: Run tests with coverage
        run: uv run pytest -q --tb=short --cov=src/dipdca --cov-report=term-missing

      - name: Streamlit smoke test
        run: |
          uv run streamlit run app.py --server.headless true --server.port 8502 &
          sleep 12
          curl -f http://localhost:8502/_stcore/health
          kill %1 || true
