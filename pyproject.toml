[project]
name = "dip-or-dca"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "yfinance>=0.2.43",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.11",
    "respx>=0.21",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipdca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # Line length: many long strings in Streamlit/Plotly code

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks tests that make real network calls (deselect with '-m not live')",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "duckdb", "streamlit.*", "scipy.*"]
ignore_missing_imports = true
